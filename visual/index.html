<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Diálogos - Jogo Digital</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* ---------------- CENA MAIN ---------------- */
        #main-scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ambient-light {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(102, 252, 241, 0.08) 0%, transparent 70%);
            animation: pulse 6s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: .5;
            }

            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .scene-title {
            position: absolute;
            top: 40px;
            font-size: 1.1rem;
            color: #45a29e;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: .7;
        }

        #scene-message {
            z-index: 5;
            text-align: center;
            max-width: 620px;
        }

        #scene-message .msg {
            font-size: 1.5rem;
            color: #66fcf1;
            line-height: 1.6;
            text-shadow: 0 0 15px rgba(102, 252, 241, .4);
        }

        .btn {
            margin: 22px 8px 0;
            padding: 12px 26px;
            background: #1f2833;
            border: 2px solid #66fcf1;
            color: #66fcf1;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: .25s;
        }

        .btn:hover {
            background: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 20px rgba(102, 252, 241, .6);
        }

        #error-msg {
            color: #ff7b7b;
            margin-top: 14px;
            font-size: .95rem;
            min-height: 1.2em;
        }

        /* ---------------- DIALOG MANAGER ---------------- */
        #dialog-manager {
            position: absolute;
            bottom: 40px;
            width: 85%;
            max-width: 900px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        #dialog-manager.closing {
            animation: fadeOut .4s forwards;
        }

        #choices-frame {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: flex-end;
            width: 75%;
            max-width: 650px;
            animation: slideUp .3s ease-out;
        }

        .choice-btn {
            background: rgba(15, 20, 25, .95);
            border: 2px solid #45a29e;
            color: #e0e0e0;
            padding: 14px 22px;
            font-size: 1.05rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all .2s cubic-bezier(.2, .8, .2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, .6);
        }

        .choice-btn:hover {
            background: #1f2833;
            border-color: #66fcf1;
            color: #fff;
            transform: translateX(-8px);
            box-shadow: 0 0 15px rgba(102, 252, 241, .4);
        }

        .choice-speaker-tag {
            color: #66fcf1;
            font-weight: bold;
            margin-right: 8px;
        }

        #speaker-badge {
            align-self: flex-start;
            background: #1f2833;
            color: #66fcf1;
            border: 2px solid #45a29e;
            border-bottom: none;
            padding: 8px 24px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(102, 252, 241, .5);
            margin-bottom: -17px;
            z-index: 2;
        }

        #dialog-frame {
            background: rgba(11, 12, 16, .95);
            border: 2px solid #45a29e;
            border-radius: 0 12px 12px 12px;
            padding: 26px 32px;
            min-height: 150px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .8), inset 0 0 15px rgba(69, 162, 158, .1);
            position: relative;
            cursor: pointer;
        }

        #dialog-frame:hover {
            border-color: #66fcf1;
        }

        #dialog-text {
            font-size: 1.35rem;
            line-height: 1.8;
            color: #f5f5f5;
            min-height: 70px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .word {
            white-space: nowrap;
        }

        .continue-prompt {
            position: absolute;
            right: 25px;
            bottom: 12px;
            font-size: .85rem;
            color: #45a29e;
            animation: bouncePrompt 1.2s infinite;
        }

        @keyframes bouncePrompt {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        /* ---------------- EFEITOS (aplicados por letra) ---------------- */
        .fx-bold {
            font-weight: 800;
        }

        .fx-shake {
            display: inline-block;
            animation: fxShake .18s infinite ease-in-out;
        }

        @keyframes fxShake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            20% {
                transform: translate(-1px, -1px) rotate(-1deg);
            }

            40% {
                transform: translate(-2px, 0) rotate(1deg);
            }

            60% {
                transform: translate(2px, 1px) rotate(0deg);
            }

            80% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            100% {
                transform: translate(-1px, 1px) rotate(-1deg);
            }
        }

        .fx-bobbing {
            display: inline-block;
            animation: fxBobbing 1s infinite ease-in-out alternate;
        }

        @keyframes fxBobbing {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-5px);
            }
        }

        .fx-appear {
            animation: appear .12s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- CENA MAIN (permanece depois que os diálogos acabam) -->
    <div id="main-scene">
        <div class="ambient-light"></div>
        <div class="scene-title">Beco Escuro - Cidade dos Bichos</div>
        <div id="scene-message" style="display:none;"></div>
        <!-- o #dialog-manager (com dialog_frame, speaker e choices) é criado/destruído em tempo de execução -->
    </div>

    <input type="file" id="xml-file-input" accept=".xml,text/xml" style="display:none;">

    <script>
        /* =========================================================================
           Caminho do XML gerado pelo compilador (src/parser.py).
           Funciona quando a página é servida por HTTP (python parser.py ... --visual).
           Se aberta direto via file://, o navegador bloqueia o fetch: use "Carregar XML".
           ========================================================================= */
        const XML_URL = "../src/saida_dialogos.xml";

        /* =========================================================================
           1. LEITURA DO XML  ->  grafo de diálogos
           ========================================================================= */
        function parseDialogosXML(xmlText) {
            const doc = new DOMParser().parseFromString(xmlText, "application/xml");
            if (doc.querySelector("parsererror")) {
                throw new Error("XML inválido: " + doc.querySelector("parsererror").textContent.slice(0, 200));
            }
            const dialogos = {};
            let primeiro = null;
            doc.querySelectorAll("conversation > dialog").forEach(d => {
                const id = d.getAttribute("id");
                if (primeiro === null) primeiro = id;
                const textEl = Array.from(d.children).find(c => c.tagName === "text");
                const choices = [];
                d.querySelectorAll(":scope > choices > choice").forEach(c => {
                    const t = Array.from(c.children).find(x => x.tagName === "text");
                    choices.push({
                        speaker: c.getAttribute("speaker"),
                        target: c.getAttribute("target"),
                        text: t ? t.textContent.trim() : ""
                    });
                });
                dialogos[id] = {
                    speaker: d.getAttribute("speaker") || "Narrador",
                    target: d.getAttribute("target"),
                    text: textEl ? textEl.textContent.trim() : "",
                    choices
                };
            });
            if (primeiro === null) throw new Error("O XML não contém nenhum <dialog>.");
            return { dialogos, inicio: primeiro };
        }

        async function carregarXMLdaRede() {
            const resp = await fetch(XML_URL + "?t=" + Date.now(), { cache: "no-store" });
            if (!resp.ok) throw new Error("HTTP " + resp.status + " ao ler " + XML_URL);
            return parseDialogosXML(await resp.text());
        }

        /* =========================================================================
           2. TEXTO COM TAGS  ->  lista de letras com estilo
              Aceita <tag>, <tag=valor>, </tag>, <pause=ms/> e a forma [tag].
           ========================================================================= */
        const TAG_RE = /(?:<|\[)(\/?)([a-zA-Z0-9_]+)(?:=([^>\]\/]*))?(\/?)(?:>|\])/g;

        function particionarTexto(texto) {
            const letras = [];
            const pilha = [];           // tags abertas: {nome, valor}
            let ultimo = 0, m;
            TAG_RE.lastIndex = 0;

            const addTexto = (str) => {
                for (const ch of str) letras.push({ ch, estilo: estiloAtual(pilha) });
            };

            while ((m = TAG_RE.exec(texto)) !== null) {
                addTexto(texto.slice(ultimo, m.index));
                ultimo = TAG_RE.lastIndex;
                const [, fecha, nome, valor, autoFecha] = m;
                const n = nome.toLowerCase();
                if (autoFecha) {
                    if (n === "pause") letras.push({ pausa: parseInt(valor, 10) || 500 });
                } else if (fecha) {
                    for (let i = pilha.length - 1; i >= 0; i--) {
                        if (pilha[i].nome === n) { pilha.splice(i, 1); break; }
                    }
                } else {
                    pilha.push({ nome: n, valor: (valor || "").trim() });
                }
            }
            addTexto(texto.slice(ultimo));
            return letras;
        }

        function estiloAtual(pilha) {
            const e = { bold: false, shake: false, bobbing: false, cor: null };
            for (const t of pilha) {
                if (t.nome === "b" || t.nome === "strong") e.bold = true;
                else if (t.nome === "shake") e.shake = true;
                else if (t.nome === "bobbing" || t.nome === "wave") e.bobbing = true;
                else if (t.nome === "color" && t.valor) e.cor = t.valor;
            }
            return e;
        }

        function criarSpanLetra(ch, e) {
            const s = document.createElement("span");
            s.textContent = ch;
            if (e.bold) s.classList.add("fx-bold");
            if (e.shake) s.classList.add("fx-shake");
            if (e.bobbing) s.classList.add("fx-bobbing");
            if (e.cor) { s.style.color = e.cor; s.style.textShadow = "0 0 10px " + e.cor; }
            return s;
        }

        /* Renderização completa e imediata (usada nas opções de escolha) */
        function renderizarImediato(container, texto) {
            container.textContent = "";
            let palavra = null;
            for (const l of particionarTexto(texto)) {
                if (l.pausa !== undefined) continue;
                if (/\s/.test(l.ch)) { palavra = null; container.appendChild(criarSpanLetra(l.ch, l.estilo)); continue; }
                if (!palavra) { palavra = document.createElement("span"); palavra.className = "word"; container.appendChild(palavra); }
                palavra.appendChild(criarSpanLetra(l.ch, l.estilo));
            }
        }

        /* =========================================================================
           3. DIALOG MANAGER
           ========================================================================= */
        const VELOCIDADE_MS = 28;   // intervalo entre letras

        class DialogManager {
            constructor(dados, scene) {
                this.dialogos = dados.dialogos;
                this.inicio = dados.inicio;
                this.scene = scene;
                this.atualId = null;
                this.digitando = false;
                this.aguardandoEscolha = false;
                this.timer = null;
                this.letras = [];
                this.indice = 0;
                this.palavra = null;
            }

            /* cria o dialog_manager + dialog_frame na cena main */
            iniciar() {
                this.root = document.createElement("div");
                this.root.id = "dialog-manager";

                this.choicesFrame = document.createElement("div");
                this.choicesFrame.id = "choices-frame";
                this.choicesFrame.style.display = "none";

                this.speakerBadge = document.createElement("div");
                this.speakerBadge.id = "speaker-badge";

                this.frame = document.createElement("div");
                this.frame.id = "dialog-frame";
                this.frame.addEventListener("click", () => this.avancar());

                this.textEl = document.createElement("div");
                this.textEl.id = "dialog-text";

                this.hint = document.createElement("div");
                this.hint.className = "continue-prompt";
                this.hint.textContent = "Clique ou pressione ESPAÇO ▶";
                this.hint.style.display = "none";

                this.frame.append(this.textEl, this.hint);
                this.root.append(this.choicesFrame, this.speakerBadge, this.frame);
                this.scene.appendChild(this.root);

                this.carregarNodo(this.inicio);
            }

            carregarNodo(id) {
                if (!id || id === "exit" || !this.dialogos[id]) { this.encerrar(); return; }
                const nodo = this.dialogos[id];
                this.atualId = id;
                this.esconderEscolhas();
                this.speakerBadge.textContent = nodo.speaker;
                this.hint.style.display = "none";
                this.iniciarDigitacao(nodo.text);
            }

            /* ---- efeito de digitação: letra após letra ---- */
            iniciarDigitacao(texto) {
                clearTimeout(this.timer);
                this.textEl.textContent = "";
                this.letras = particionarTexto(texto);
                this.indice = 0;
                this.palavra = null;
                this.digitando = true;
                this.proximaLetra();
            }

            proximaLetra() {
                if (this.indice >= this.letras.length) { this.terminarDigitacao(); return; }
                const l = this.letras[this.indice++];
                if (l.pausa !== undefined) {
                    this.timer = setTimeout(() => this.proximaLetra(), l.pausa);
                    return;
                }
                this.inserirLetra(l);
                const lenta = /[.!?…]/.test(l.ch) ? 6 : (/[,;:]/.test(l.ch) ? 3 : 1);
                this.timer = setTimeout(() => this.proximaLetra(), VELOCIDADE_MS * lenta * (/\s/.test(l.ch) ? 0.5 : 1));
            }

            inserirLetra(l) {
                const span = criarSpanLetra(l.ch, l.estilo);
                span.classList.add("fx-appear");
                if (/\s/.test(l.ch)) { this.palavra = null; this.textEl.appendChild(span); return; }
                if (!this.palavra) {
                    this.palavra = document.createElement("span");
                    this.palavra.className = "word";
                    this.textEl.appendChild(this.palavra);
                }
                this.palavra.appendChild(span);
            }

            terminarDigitacao() {
                clearTimeout(this.timer);
                this.digitando = false;
                const nodo = this.dialogos[this.atualId];
                if (nodo.choices.length > 0) this.mostrarEscolhas(nodo.choices);
                else this.hint.style.display = "block";
            }

            /* ---- escolhas: painel criado ACIMA do dialog_frame ---- */
            mostrarEscolhas(opcoes) {
                this.aguardandoEscolha = true;
                this.choicesFrame.textContent = "";
                this.choicesFrame.style.display = "flex";
                opcoes.forEach(opc => {
                    const btn = document.createElement("button");
                    btn.className = "choice-btn";
                    if (opc.speaker) {
                        const tag = document.createElement("span");
                        tag.className = "choice-speaker-tag";
                        tag.textContent = "[" + opc.speaker + "]";
                        btn.appendChild(tag);
                    }
                    const corpo = document.createElement("span");
                    renderizarImediato(corpo, opc.text);
                    btn.appendChild(corpo);
                    btn.addEventListener("click", (e) => { e.stopPropagation(); this.carregarNodo(opc.target); });
                    this.choicesFrame.appendChild(btn);
                });
            }

            esconderEscolhas() {
                this.aguardandoEscolha = false;
                this.choicesFrame.style.display = "none";
                this.choicesFrame.textContent = "";
            }

            avancar() {
                if (this.aguardandoEscolha) return;
                if (this.digitando) {            // completa o texto instantaneamente
                    clearTimeout(this.timer);
                    while (this.indice < this.letras.length) {
                        const l = this.letras[this.indice++];
                        if (l.pausa === undefined) this.inserirLetra(l);
                    }
                    this.terminarDigitacao();
                    return;
                }
                this.carregarNodo(this.dialogos[this.atualId].target);
            }

            /* destrói o dialog_frame (e todo o manager): sobra só a cena main */
            encerrar() {
                clearTimeout(this.timer);
                const root = this.root;
                root.classList.add("closing");
                setTimeout(() => { root.remove(); fimDosDialogos(); }, 400);
                this.root = null;
            }
        }

        /* =========================================================================
           4. CONTROLE DA CENA
           ========================================================================= */
        const scene = document.getElementById("main-scene");
        const msgEl = document.getElementById("scene-message");
        const fileInput = document.getElementById("xml-file-input");
        let manager = null;
        let ultimoXMLManual = null;     // dados carregados pelo botão "Carregar XML"

        function mostrarMensagem(html, comRecarregar) {
            msgEl.innerHTML = "";
            const p = document.createElement("div");
            p.className = "msg"; p.innerHTML = html;
            msgEl.appendChild(p);
            const b1 = document.createElement("button");
            b1.className = "btn"; b1.textContent = comRecarregar ? "Reiniciar diálogo" : "Tentar de novo";
            b1.onclick = () => iniciarDialogos();
            const b2 = document.createElement("button");
            b2.className = "btn"; b2.textContent = "Carregar XML...";
            b2.onclick = () => fileInput.click();
            msgEl.append(b1, b2);
            const err = document.createElement("div");
            err.id = "error-msg";
            msgEl.appendChild(err);
            msgEl.style.display = "block";
        }

        function fimDosDialogos() {
            mostrarMensagem("Diálogo encerrado.<br>Você agora está livre para explorar a cena principal.", true);
        }

        async function iniciarDialogos() {
            msgEl.style.display = "none";
            if (manager && manager.root) manager.root.remove();
            let dados;
            try {
                dados = ultimoXMLManual || await carregarXMLdaRede();   // relê o XML a cada início
            } catch (e) {
                mostrarMensagem("Não consegui ler o XML do compilador.<br><small>Rode <b>python parser.py roteiro.dialogo --visual</b> ou escolha o arquivo manualmente.</small>", false);
                document.getElementById("error-msg").textContent = e.message;
                return;
            }
            manager = new DialogManager(dados, scene);
            manager.iniciar();
        }

        fileInput.addEventListener("change", async () => {
            const f = fileInput.files[0];
            if (!f) return;
            try {
                ultimoXMLManual = parseDialogosXML(await f.text());
                fileInput.value = "";
                iniciarDialogos();
            } catch (e) {
                const err = document.getElementById("error-msg");
                if (err) err.textContent = e.message;
            }
        });

        window.addEventListener("keydown", (e) => {
            if ((e.code === "Space" || e.code === "Enter") && manager && manager.root) {
                e.preventDefault();
                manager.avancar();
            }
        });

        window.addEventListener("load", iniciarDialogos);
    </script>
</body>

</html>
